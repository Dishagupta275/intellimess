<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner – IntelliMess</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin:0; }

        /* ── DESKTOP layout ── */
        .page-wrap {
            max-width:1100px; margin:28px auto; padding:0 24px 60px;
            display:grid; grid-template-columns:420px 1fr; gap:24px; align-items:start;
        }
        .left-col  { grid-column:1; }
        .right-col { grid-column:2; }
        .page-hdr  { grid-column:1/-1; color:#fff; margin-bottom:4px; }
        .page-hdr h1 { font-size:26px; font-weight:700; margin-bottom:4px; }
        .page-hdr p  { font-size:13px; opacity:.85; }

        /* ── MOBILE layout ── */
        @media(max-width:700px){
            .page-wrap { grid-template-columns:1fr; max-width:520px; padding:0 14px 60px; }
            .left-col, .right-col { grid-column:1; }
        }

        .meal-selector { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
        .meal-btn { flex:1; min-width:80px; padding:10px 6px; border-radius:12px;
                    font-size:13px; font-weight:600; cursor:pointer; text-align:center;
                    border:2px solid #e0e0e0; background:#fff; color:#888;
                    transition:all .2s; font-family:inherit; }
        .meal-btn.active { color:#fff; border-color:transparent; }
        .meal-btn[data-meal="Breakfast"].active { background:#FF7043; }
        .meal-btn[data-meal="Lunch"].active     { background:#4CAF50; }
        .meal-btn[data-meal="Snacks"].active    { background:#9C27B0; }
        .meal-btn[data-meal="Dinner"].active    { background:#1565c0; }

        .scanner-card { background:#fff; border-radius:20px; overflow:hidden;
                        box-shadow:0 8px 30px rgba(0,0,0,.12); margin-bottom:16px; }
        .cam-wrap { position:relative; background:#111; aspect-ratio:1;
                    display:flex; align-items:center; justify-content:center; overflow:hidden; }
        #video  { width:100%; height:100%; object-fit:cover; display:none; }
        #canvas { display:none; }

        .scan-overlay { position:absolute; inset:0; pointer-events:none;
                        display:none; align-items:center; justify-content:center; }
        .scan-box { width:65%; max-width:220px; aspect-ratio:1; position:relative; }
        .scan-box::before,.scan-box::after,.scan-box span::before,.scan-box span::after {
            content:''; position:absolute; width:22px; height:22px;
            border-color:#4CAF50; border-style:solid; }
        .scan-box::before  { top:0;    left:0;  border-width:3px 0 0 3px; }
        .scan-box::after   { top:0;    right:0; border-width:3px 3px 0 0; }
        .scan-box span::before { bottom:0; left:0;  border-width:0 0 3px 3px; }
        .scan-box span::after  { bottom:0; right:0; border-width:0 3px 3px 0; }
        .scan-line { position:absolute; left:4px; right:4px; height:2px;
                     background:linear-gradient(90deg,transparent,#4CAF50,transparent);
                     animation:scanline 1.8s linear infinite; top:4px; }
        @keyframes scanline { 0%{top:4px} 100%{bottom:4px;top:calc(100% - 6px)} }

        .cam-placeholder { color:#888; font-size:13px; text-align:center;
                           padding:30px 20px; display:flex; flex-direction:column;
                           align-items:center; gap:10px; }
        .cam-placeholder i { font-size:44px; color:#555; }
        .cam-placeholder .hint { font-size:11px; color:#555; max-width:240px; line-height:1.6; }

        .scan-ctrl { padding:14px 16px; display:flex; gap:10px; }
        .btn-start { flex:1; padding:13px; border-radius:12px; font-size:15px;
                     font-weight:700; cursor:pointer; border:none; font-family:inherit;
                     background:#4CAF50; color:#fff; transition:all .2s; }
        .btn-start:hover { background:#388e3c; }
        .btn-start:disabled { background:#ccc; cursor:not-allowed; }
        .btn-stop { padding:13px 18px; border-radius:12px; font-size:14px;
                    font-weight:700; cursor:pointer; border:none; font-family:inherit;
                    background:#f5f5f5; color:#888; }

        /* Stats */
        .stat-bar { display:flex; gap:10px; margin-bottom:16px; }
        .stat-chip { flex:1; background:#fff; border-radius:10px; padding:12px 10px;
                     text-align:center; font-size:11px; color:#888;
                     box-shadow:0 2px 8px rgba(0,0,0,.06); }
        .stat-chip strong { display:block; font-size:22px; color:#333; font-weight:700; }

        /* Recent scans */
        .recent-card { background:#fff; border-radius:16px; padding:20px 22px;
                       box-shadow:0 4px 16px rgba(0,0,0,.07); }
        .recent-title { font-size:14px; font-weight:700; color:#333; margin-bottom:14px;
                        display:flex; align-items:center; gap:8px; }
        .recent-title i { color:#4CAF50; }
        .scan-item { display:flex; align-items:center; gap:12px; padding:10px 0;
                     border-bottom:1px solid #f5f5f5; }
        .scan-item:last-child { border:none; }
        .scan-avatar { width:38px; height:38px; border-radius:50%; background:#e8f5e9;
                       display:flex; align-items:center; justify-content:center;
                       font-size:15px; font-weight:700; color:#2e7d32; flex-shrink:0; }
        .scan-avatar.err  { background:#fce4ec; color:#c62828; }
        .scan-avatar.warn { background:#fff3e0; color:#e65100; }
        .scan-info { flex:1; min-width:0; }
        .scan-name { font-size:13px; font-weight:600; color:#333; }
        .scan-sub  { font-size:11px; color:#aaa; margin-top:1px; }
        .scan-time { font-size:11px; color:#ccc; white-space:nowrap; }
        .empty-scans { text-align:center; padding:30px; color:#ccc; font-size:13px; }
        .empty-scans i { display:block; font-size:32px; margin-bottom:8px; }

        /* Toast */
        .result-toast { position:fixed; bottom:24px; left:50%;
                        transform:translateX(-50%) translateY(120px);
                        min-width:300px; max-width:90vw; border-radius:16px;
                        padding:18px 20px; box-shadow:0 8px 30px rgba(0,0,0,.25);
                        z-index:999; transition:transform .35s cubic-bezier(.34,1.56,.64,1);
                        background:#fff; }
        .result-toast.show { transform:translateX(-50%) translateY(0); }
        .result-toast.success { border-left:5px solid #4CAF50; }
        .result-toast.error   { border-left:5px solid #ef5350; }
        .result-toast.warning { border-left:5px solid #FF9800; }
        .toast-name   { font-size:16px; font-weight:700; color:#222; margin-bottom:4px; }
        .toast-detail { font-size:12px; color:#888; }
        .toast-icon   { font-size:28px; float:right; margin-left:12px; margin-top:-2px; }

        .back-link { color:#fff; text-decoration:none; font-size:14px; font-weight:500;
                     display:inline-flex; align-items:center; gap:7px; margin-bottom:14px; }
        .back-link:hover { opacity:.8; }

        /* Desktop: bigger recent list */
        @media(min-width:701px){
            .recent-card { min-height:400px; }
            .stat-chip strong { font-size:28px; }
        }
    </style>
</head>
<body>
<div class="dashboard-wrapper">
    <nav class="navbar">
        <a href="/admin" class="navbar-brand"><i class="fas fa-utensils"></i><span>IntelliMess</span></a>
        <div class="nav-links">
            <a href="/admin"><i class="fas fa-home"></i> Dashboard</a>
            <a href="/admin/attendance"><i class="fas fa-list-check"></i> Attendance</a>
            <a href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </nav>

    <div class="page-wrap">
        <div class="page-hdr">
            <a href="/admin/attendance" class="back-link"><i class="fas fa-arrow-left"></i> Attendance</a>
            <h1><i class="fas fa-qrcode"></i> QR Scanner</h1>
            <p>{{ today.strftime('%A, %d %B %Y') }} — point camera at student's QR code</p>
        </div>

        <!-- LEFT: camera + meal selector -->
        <div class="left-col">
            <div class="meal-selector">
                <button class="meal-btn {% if current_meal=='Breakfast' %}active{% endif %}" data-meal="Breakfast" onclick="setMeal('Breakfast')">☀️ Breakfast</button>
                <button class="meal-btn {% if current_meal=='Lunch' %}active{% endif %}"     data-meal="Lunch"     onclick="setMeal('Lunch')">🍛 Lunch</button>
                <button class="meal-btn {% if current_meal=='Snacks' %}active{% endif %}"   data-meal="Snacks"    onclick="setMeal('Snacks')">🥪 Snacks</button>
                <button class="meal-btn {% if current_meal=='Dinner' %}active{% endif %}"   data-meal="Dinner"    onclick="setMeal('Dinner')">🌙 Dinner</button>
            </div>

            <div class="scanner-card">
                <div class="cam-wrap" id="camWrap">
                    <div class="cam-placeholder" id="camPlaceholder">
                        <i class="fas fa-camera"></i>
                        <span>Tap <strong>Start Scanning</strong> to open camera</span>
                        <span class="hint">Allow camera access when prompted</span>
                    </div>
                    <video id="video" autoplay playsinline muted></video>
                    <canvas id="canvas"></canvas>
                    <div class="scan-overlay" id="scanOverlay">
                        <div class="scan-box"><span></span><div class="scan-line"></div></div>
                    </div>
                </div>
                <div class="scan-ctrl">
                    <button class="btn-start" id="startBtn" onclick="startScanner()">
                        <i class="fas fa-camera"></i> Start Scanning
                    </button>
                    <button class="btn-stop" id="stopBtn" onclick="stopScanner()" style="display:none;">
                        <i class="fas fa-stop"></i> Stop
                    </button>
                </div>
            </div>
        </div>

        <!-- RIGHT: stats + recent scans -->
        <div class="right-col">
            <div class="stat-bar">
                <div class="stat-chip"><strong id="stat-total">0</strong>Scanned</div>
                <div class="stat-chip"><strong id="stat-new">0</strong>New ✅</div>
                <div class="stat-chip"><strong id="stat-already">0</strong>Already</div>
                <div class="stat-chip"><strong id="stat-err">0</strong>Errors</div>
            </div>

            <div class="recent-card">
                <div class="recent-title"><i class="fas fa-history"></i> Recent Scans</div>
                <div id="recentList">
                    <div class="empty-scans"><i class="fas fa-qrcode"></i>No scans yet</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="result-toast" id="toast">
    <span class="toast-icon" id="toastIcon"></span>
    <div class="toast-name" id="toastName"></div>
    <div class="toast-detail" id="toastDetail"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
let currentMeal = '{{ current_meal }}';
let scanning    = false;
let stream      = null;
let scanInterval = null;
let lastToken   = null;
let cooldown    = false;
let stats       = { total:0, newMark:0, already:0, err:0 };
let recentScans = [];

const video = document.getElementById('video');

// Small dedicated canvas for jsQR — faster processing
const scanCanvas = document.createElement('canvas');
const scanCtx    = scanCanvas.getContext('2d', { willReadFrequently: true });
scanCanvas.width  = 400;
scanCanvas.height = 400;

function setMeal(meal) {
    currentMeal = meal;
    document.querySelectorAll('.meal-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.meal === meal));
}

async function startScanner() {
    const isSecure = location.protocol === 'https:' ||
                     location.hostname === 'localhost' ||
                     location.hostname === '127.0.0.1';
    if (!isSecure) {
        alert('Camera requires HTTPS. Use the Railway/Render URL, not a local IP.');
        return;
    }

    const btn = document.getElementById('startBtn');
    btn.textContent = 'Starting…';
    btn.disabled = true;

    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
        });
        video.srcObject = stream;
        await video.play();

        video.style.display = 'block';
        document.getElementById('camPlaceholder').style.display = 'none';
        document.getElementById('scanOverlay').style.display    = 'flex';
        btn.style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';
        scanning = true;
        startScanLoop();

    } catch(err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-camera"></i> Start Scanning';
        const ph = document.getElementById('camPlaceholder');
        if (err.name === 'NotAllowedError') {
            ph.innerHTML = `<i class="fas fa-ban" style="color:#ef5350;"></i>
                <strong style="color:#c62828;">Permission denied</strong>
                <span class="hint">Chrome: click 🔒 → Camera → Allow → refresh<br>
                Safari: Settings → Safari → Camera → Allow</span>`;
        } else {
            ph.innerHTML = `<i class="fas fa-exclamation-triangle" style="color:#FF9800;"></i>
                <span>Camera error: ${err.message}</span>`;
        }
        ph.style.display = 'flex';
    }
}

function stopScanner() {
    scanning = false;
    if (scanInterval) clearInterval(scanInterval);
    if (stream) stream.getTracks().forEach(t => t.stop());
    video.style.display = 'none';
    document.getElementById('scanOverlay').style.display = 'none';
    document.getElementById('camPlaceholder').style.display = 'flex';
    document.getElementById('camPlaceholder').innerHTML = `
        <i class="fas fa-camera"></i><span>Camera stopped</span>
        <span class="hint">Tap Start Scanning to resume</span>`;
    document.getElementById('startBtn').style.display   = 'block';
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').innerHTML = '<i class="fas fa-camera"></i> Start Scanning';
    document.getElementById('stopBtn').style.display    = 'none';
}

function startScanLoop() {
    if (scanInterval) clearInterval(scanInterval);

    // Multi-resolution scan: try full res first, then cropped center
    function tryScan() {
        if (!scanning || video.readyState < 2 || video.videoWidth === 0) return;

        const vw = video.videoWidth;
        const vh = video.videoHeight;

        // Attempt 1: full frame at native resolution
        scanCanvas.width  = vw;
        scanCanvas.height = vh;
        scanCtx.drawImage(video, 0, 0, vw, vh);
        let imgData = scanCtx.getImageData(0, 0, vw, vh);
        let code = jsQR(imgData.data, vw, vh, { inversionAttempts: 'attemptBoth' });

        // Attempt 2: center crop (QR usually in middle) — sharper focus area
        if (!code) {
            const cx = Math.floor(vw * 0.15), cy = Math.floor(vh * 0.15);
            const cw = Math.floor(vw * 0.70), ch = Math.floor(vh * 0.70);
            scanCanvas.width  = cw;
            scanCanvas.height = ch;
            scanCtx.drawImage(video, cx, cy, cw, ch, 0, 0, cw, ch);
            imgData = scanCtx.getImageData(0, 0, cw, ch);
            code = jsQR(imgData.data, cw, ch, { inversionAttempts: 'attemptBoth' });
        }

        // Attempt 3: contrast boost — helps with dim screens
        if (!code) {
            const cw = scanCanvas.width, ch = scanCanvas.height;
            scanCtx.drawImage(video, 0, 0, cw, ch);
            scanCtx.filter = 'contrast(1.8) brightness(1.1)';
            scanCtx.drawImage(video, 0, 0, cw, ch);
            scanCtx.filter = 'none';
            imgData = scanCtx.getImageData(0, 0, cw, ch);
            code = jsQR(imgData.data, cw, ch, { inversionAttempts: 'attemptBoth' });
        }

        if (code && code.data && !cooldown) {
            console.log('[QR] Raw data:', code.data);
            let token = null;
            try {
                const url = new URL(code.data);
                token = url.searchParams.get('token');
            } catch(e) {
                token = code.data;
            }
            console.log('[QR] Token:', token);
            if (token && token !== lastToken) {
                lastToken = token;
                processQR(token);
            }
        }
    }
    scanInterval = setInterval(tryScan, 400);
}

function processQR(token) {
    cooldown = true;
    if (navigator.vibrate) navigator.vibrate([100]);

    fetch(`/admin/scan/mark?token=${encodeURIComponent(token)}&meal=${encodeURIComponent(currentMeal)}`)
    .then(r => r.json())
    .then(data => {
        console.log('[QR] Server response:', data);
        stats.total++;
        if (!data.ok) {
            stats.err++;
            showToast('error', '❌', 'Error', data.error || 'Could not mark attendance');
            addRecent('?', data.error || 'Error', 'err');
        } else if (data.already) {
            stats.already++;
            showToast('warning', '⚠️', data.username, `Already ${data.status} for ${currentMeal}`);
            addRecent(data.username, `${data.roll_no} · Already ${data.status}`, 'warn');
        } else {
            stats.newMark++;
            const g = data.guest_count > 0 ? ` +${data.guest_count} guest` : '';
            showToast('success', '✅', data.username, `${data.food_type} ${currentMeal} marked present${g}`);
            addRecent(data.username, `${data.roll_no} · ${data.food_type}${g}`, 'ok');
        }
        updateStats();
        setTimeout(() => { lastToken = null; cooldown = false; }, 2500);
    })
    .catch(err => {
        console.error('[QR] Fetch error:', err);
        stats.err++; updateStats();
        showToast('error', '❌', 'Network Error', err.message);
        setTimeout(() => { lastToken = null; cooldown = false; }, 2500);
    });
}

function showToast(type, icon, name, detail) {
    const t = document.getElementById('toast');
    t.className = `result-toast ${type}`;
    document.getElementById('toastIcon').textContent   = icon;
    document.getElementById('toastName').textContent   = name;
    document.getElementById('toastDetail').textContent = detail;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 4000);
}

function addRecent(name, sub, type) {
    const now = new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
    recentScans.unshift({ name: name || '?', sub, type, time: now });
    if (recentScans.length > 20) recentScans.pop();
    document.getElementById('recentList').innerHTML = recentScans.map(s => `
        <div class="scan-item">
            <div class="scan-avatar ${s.type !== 'ok' ? s.type : ''}">${(s.name[0]||'?').toUpperCase()}</div>
            <div class="scan-info">
                <div class="scan-name">${s.name}</div>
                <div class="scan-sub">${s.sub}</div>
            </div>
            <div class="scan-time">${s.time}</div>
        </div>`).join('');
}

function updateStats() {
    document.getElementById('stat-total').textContent   = stats.total;
    document.getElementById('stat-new').textContent     = stats.newMark;
    document.getElementById('stat-already').textContent = stats.already;
    document.getElementById('stat-err').textContent     = stats.err;
}
</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
